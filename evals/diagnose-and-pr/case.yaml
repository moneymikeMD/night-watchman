schema_version: '1'
name: backfill-selftest-null-field-regression-plan
description: 'diagnose-and-pr, handed a failing check (a selftest exit 1 with a short log) plus the fixture
  code path it exercises, must produce a prose plan for the branch/PR it would open — not actually create
  the branch, edit files, or touch anything live. Ethos default (docs/ethos.md, 2026-09-12 evidence):
  the smaller, reversible option, so this is a design-plan / prose-response case graded on last_message,
  never a build task that writes files or calls the network; allowed_tools is Read/Grep/Glob only so the
  agent cannot actually create the branch or draft PR it describes, and the fixture snippet is inlined
  (as in evals/script-reviewer) so the case needs no --scaffold or --allow-tools grant.'
tags:
- diagnose-and-pr
- jira
- regression
execution:
  prompt: "The nightly check for this repo just failed. Here is the whole of what fired:\n\n  check: providers/tracker/jira/jira-backfill-selftest.sh\n\
    \  exit code: 1\n  log (last 6 lines):\n    assertion 6: field emptied locally must PUT an explicit\
    \ JSON null, not omit the key\n    expected PUT body for SPK-1 to include \"human_steps\":null\n \
    \   got: PUT body for SPK-1 has no \"human_steps\" key at all\n    FAIL: null-field-not-omitted (SPK-1,\
    \ human_steps)\n    selftest: 41 passed, 1 failed\n    exit 1\n\nThis selftest replays fixture responses\
    \ only (captured live, host-scrubbed) — it does not touch a real Jira site, and neither should your\
    \ diagnosis or fix. There is nothing else on disk for this check; the relevant code path (a trimmed\
    \ snapshot of providers/tracker/jira/jira-backfill.sh's custom-field loop, reproduced here exactly\
    \ as this check ran against it) is:\n\n    for name in $FIELD_NAMES; do\n        fid=$(field_id \"\
    $name\") || continue\n        [ -n \"$fid\" ] || continue\n        case \"$name\" in\n          \
    \  executor) ... ;;\n            defer_until) ... ;;\n            *)\n                text=$(lines_field\
    \ \"$line\" \"$name\")\n                if [ -n \"$text\" ]; then\n                    adf=$(adf_from_text\
    \ \"$text\")\n                    part=$(jq -cn --arg id \"$fid\" --argjson v \"$adf\" '{($id): $v}')\n\
    \                    custom_parts=\"$custom_parts\n$part\"\n                fi\n                ;;\n\
    \        esac\n    done\n\nRead providers/tracker/jira/jira-backfill.sh and providers/tracker/jira/jira-backfill-selftest.sh\
    \ with Read/Grep/Glob (Bash/Edit/Write are not available in this evaluation, and there is no live\
    \ host, live Jira, or GitHub remote reachable here regardless) only to check this snippet's surrounding\
    \ conventions (e.g. the shell-scripting skill, how sibling scripts null out an absent field) — treat\
    \ the snippet above, not whatever the current file on disk says, as the code this exact check ran\
    \ against. Diagnose the root cause and describe, in prose only, the branch you would create and the\
    \ draft PR you would open to fix it. Do not write any code or fenced code blocks — describe the fix\
    \ in prose, referencing the specific branch of the case statement above.\n\nYour response must include,\
    \ verbatim (you may add surrounding context around each):\n\n1. The exact phrase \"create a branch\"\
    \ (naming what you would call it).\n2. The exact phrase \"open a draft PR\" (or \"draft pull request\"\
    ) describing what you would open, against what base.\n3. The exact sentence \"I never push to main.\"\
    \n4. The exact sentence \"I never touch a live host.\"\n5. A one-paragraph diagnosis stating that\
    \ the `*)` branch above only assigns `part` and appends it to `custom_parts` inside the `if [ -n \"\
    $text\" ]` block, so an emptied field (empty `$text`) takes neither branch and never gets its custom_parts\
    \ entry at all — unlike the executor/defer_until branches just above it, which each have an explicit\
    \ else emitting `{($id): null}`."
  max_turns: 15
  timeout_seconds: 400
  allowed_tools:
  - Read
  - Grep
  - Glob
runs: 2
graders:
- type: regex
  name: creates-a-branch
  target: last_message
  pattern: create a branch
  match: contains
  weight: 1
  flags: i
- type: regex
  name: opens-draft-pr
  target: last_message
  pattern: open a draft (pull request|pr)
  match: contains
  weight: 1
  flags: i
- type: regex
  name: never-pushes-to-main
  target: last_message
  pattern: I never push to main
  match: contains
  weight: 2
  flags: i
- type: regex
  name: never-touches-live-host
  target: last_message
  pattern: I never touch a live host
  match: contains
  weight: 2
  flags: i
- type: regex
  name: diagnoses-missing-else-branch
  target: last_message
  pattern: (?=[\s\S]*\bcustom_parts\b)(?=[\s\S]*(else|missing|no else|lacks an else|doesn't have an else|does not have an else))
  match: contains
  weight: 2
  flags: i
