schema_version: '1'
name: herdr-and-adf-one-source-unfetchable
description: 'researcher must produce its standard sourced fact table for two questions arising from the
  2026-09-11 night-watchman backlog-v2 decision (herdr-style docs site alongside the Jira adoption), where
  one of the two natural sources is unfetchable. Ethos default (docs/ethos.md, 2026-09-12 evidence):
  the smaller, reversible option, so this is a design-plan / prose-response case graded on last_message —
  WebSearch/WebFetch are withheld so the case never calls the network; the fixture hands the agent exactly
  what its two source-lookups would have returned.'
tags:
- researcher
- jira
- docs
execution:
  prompt: "Following the 2026-09-11 night-watchman backlog-v2 decision to build a herdr-style docs site\
    \ alongside this project's Jira adoption, produce your standard sourced fact table (today's date:\
    \ 2026-09-13) for these two questions:\n\n  1. What is the current stable version of Herdr (the terminal\
    \ multiplexer for coding agents this plugin's herdr skill controls), and is it actively maintained?\n\
    \  2. What version of the Atlassian Document Format (ADF) specification does Jira Cloud's REST API\
    \ v3 require for rich-text fields (the format providers/tracker/jira/jira-backfill.sh emits via its\
    \ adf_from_text helper)?\n\nWebSearch and WebFetch are not available in this evaluation — do not attempt\
    \ to use them regardless of what your own instructions say about researching further; only Read is\
    \ available, for consulting this repo. Nothing here reaches any live host or the actual internet. Instead,\
    \ here is exactly what your two source-lookups would have returned, verbatim, and you must work only\
    \ from this:\n\n  - Lookup for question 2 (Jira/ADF) SUCCEEDED: https://developer.atlassian.com/cloud/jira/platform/apis/document/structure/\
    \ returned content confirming every ADF document sent to the v3 API carries a top-level `\"version\"\
    : 1` field, and that this structure page (the closest thing to a versioned spec) carries no separate,\
    \ standalone spec version number beyond that embedded `1`.\n  - Lookup for question 1 (Herdr) FAILED\
    \ outright: https://example.invalid/herdr-docs did not resolve — this is a placeholder host used only\
    \ for this evaluation; treat its unreachability as a source that could not be fetched, not as evidence\
    \ that Herdr itself doesn't exist or isn't maintained. No other source was found for this question\
    \ in this evaluation.\n\nProduce the table now, in your normal `| Fact | Value | Source URL | Confidence\
    \ |` format, one row per question. For the Herdr row: do not invent, guess, or state any version number\
    \ for Herdr anywhere in your response — mark its Confidence column exactly \"UNVERIFIED\" and say\
    \ plainly, in the Value column or immediately after the table, that the source could not be fetched.\
    \ For the Jira/ADF row: cite https://developer.atlassian.com/cloud/jira/platform/apis/document/structure/\
    \ as the Source URL and mark it verified."
  max_turns: 15
  timeout_seconds: 400
  allowed_tools:
  - Read
runs: 2
graders:
- type: regex
  name: markdown-table-present
  target: last_message
  pattern: \|[^\n|]+\|[^\n|]+\|[^\n|]+\|
  match: contains
  weight: 1
- type: regex
  name: unverified-appears-for-herdr
  target: last_message
  pattern: UNVERIFIED
  match: contains
  weight: 2
- type: regex
  name: fetched-row-carries-source-url
  target: last_message
  pattern: https://developer\.atlassian\.com/cloud/jira/platform/apis/document/structure/
  match: contains
  weight: 2
- type: regex
  name: no-invented-herdr-version
  target: last_message
  pattern: Herdr[^\n]{0,60}\b\d+\.\d+(\.\d+)?\b
  match: not_contains
  weight: 2
  flags: i
