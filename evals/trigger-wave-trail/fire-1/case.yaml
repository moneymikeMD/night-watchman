schema_version: '1'
name: trigger-wave-trail-fire-1
description: "Should load night-watchman:wave-trail through the Skill tool."
tags:
- trigger
- wave-trail
- fire
execution:
  prompt: "I'm dispatching tonight's wave through the workflow provider and won't be watching. Keep a decision trail for it."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-fires
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?wave-trail"'
  min: 1
