schema_version: '1'
name: trigger-wrap-up-miss-1
description: "Near-miss: should not load night-watchman:wrap-up."
tags:
- trigger
- wrap-up
- miss
execution:
  prompt: "Wrap this function in a try/except that logs and re-raises: def f(): return 1/0"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?wrap-up"'
  min: 0
  max: 0
