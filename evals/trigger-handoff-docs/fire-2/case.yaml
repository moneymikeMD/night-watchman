schema_version: '1'
name: trigger-handoff-docs-fire-2
description: "Should load night-watchman:handoff-docs through the Skill tool."
tags:
- trigger
- handoff-docs
- fire
execution:
  prompt: "I'm moving this work to the Mac tomorrow; leave a note for whoever continues it."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-fires
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?handoff-docs"'
  min: 1
