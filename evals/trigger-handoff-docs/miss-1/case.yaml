schema_version: '1'
name: trigger-handoff-docs-miss-1
description: "Near-miss: should not load night-watchman:handoff-docs."
tags:
- trigger
- handoff-docs
- miss
execution:
  prompt: "Write a README section explaining how to install this plugin."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?handoff-docs"'
  min: 0
  max: 0
