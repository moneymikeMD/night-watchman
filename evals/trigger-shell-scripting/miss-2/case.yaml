schema_version: '1'
name: trigger-shell-scripting-miss-2
description: "Near-miss: should not load night-watchman:shell-scripting."
tags:
- trigger
- shell-scripting
- miss
execution:
  prompt: "In one paragraph, what is the difference between a POSIX shell and bash?"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?shell-scripting"'
  min: 0
  max: 0
