schema_version: '1'
name: trigger-tickets-protocol-fire-2
description: "Should load night-watchman:tickets-protocol through the Skill tool."
tags:
- trigger
- tickets-protocol
- fire
execution:
  prompt: "Move NWM-310 from open to in-progress; I'm starting on it now."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-fires
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?tickets-protocol"'
  min: 1
