schema_version: '1'
name: trigger-to-issues-miss-2
description: "Near-miss: should not load night-watchman:to-issues."
tags:
- trigger
- to-issues
- miss
execution:
  prompt: "Grill me on this plan before anything gets written down: we move CI to self-hosted runners on hetricus."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?to-issues"'
  min: 0
  max: 0
