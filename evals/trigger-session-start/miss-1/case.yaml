schema_version: '1'
name: trigger-session-start-miss-1
description: "Near-miss: should not load night-watchman:session-start."
tags:
- trigger
- session-start
- miss
execution:
  prompt: "Start the docs site dev server for me."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?session-start"'
  min: 0
  max: 0
