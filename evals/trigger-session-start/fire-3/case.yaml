schema_version: '1'
name: trigger-session-start-fire-3
description: "Should load night-watchman:session-start through the Skill tool."
tags:
- trigger
- session-start
- fire
execution:
  prompt: "Dispatch NWM-301 and NWM-302 to workers tonight; I already know those are the two I want."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-fires
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?session-start"'
  min: 1
