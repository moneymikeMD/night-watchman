schema_version: '1'
name: trigger-grill-fire-3
description: "Should load night-watchman:grill through the Skill tool."
tags:
- trigger
- grill
- fire
execution:
  prompt: "Interview me until nothing is assumed: nightly waves run on hetricus only and results land by 6am."
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-fires
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?grill"'
  min: 1
