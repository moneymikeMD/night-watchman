schema_version: '1'
name: trigger-grill-miss-1
description: "Near-miss: should not load night-watchman:grill."
tags:
- trigger
- grill
- miss
execution:
  prompt: "What's a good marinade for grilled salmon?"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Grep
  - Glob
runs: 3
graders:
- type: tool_used
  name: skill-stays-quiet
  tool: Skill
  input_match: '"skill":\s*"(night-watchman:)?grill"'
  min: 0
  max: 0
