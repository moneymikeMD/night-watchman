name: Website Deploy

# Builds docs/preview/website and deploys it to GitHub Pages; Pages must be
# set to "GitHub Actions" as its source. configure-pages supplies --site and
# --base, so the same astro config works on a project page or a custom domain.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-deploy.yml"
      - "docs/preview/**"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancelling a
# production deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_PATH: docs/preview/website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.BUILD_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with Astro
        run: |
          bunx --bun astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
