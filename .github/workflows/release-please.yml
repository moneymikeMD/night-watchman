name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      BUZZ_URL: ${{ secrets.BUZZ_RELEASES_HOOK_URL }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: resolve release PR
        id: pr
        if: steps.rp.outputs.prs_created == 'true' && env.BUZZ_URL != ''
        continue-on-error: true
        env:
          PR_JSON: ${{ steps.rp.outputs.pr }}
          PRS_JSON: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          pr="$(jq -c 'if type == "array" then .[0] else . end' <<<"${PR_JSON:-${PRS_JSON:-null}}")"
          num="$(jq -r '.number // empty' <<<"$pr")"
          [ -n "$num" ] || exit 0
          title="$(jq -r '.title // empty' <<<"$pr")"
          {
            echo "number=$num"
            echo "version=${title##* }"
          } >> "$GITHUB_OUTPUT"

      - name: notify release PR
        if: steps.pr.outputs.number != ''
        uses: moneymikeMD/ai-toolkit/actions/notify-buzz@v1
        with:
          url: ${{ secrets.BUZZ_RELEASES_HOOK_URL }}
          secret: ${{ secrets.BUZZ_RELEASES_HOOK_SECRET }}
          status: release-pr
          title: night-watchman release PR ${{ steps.pr.outputs.version }}
          link: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}

      - name: notify release
        if: steps.rp.outputs.release_created == 'true' && env.BUZZ_URL != ''
        uses: moneymikeMD/ai-toolkit/actions/notify-buzz@v1
        with:
          url: ${{ secrets.BUZZ_RELEASES_HOOK_URL }}
          secret: ${{ secrets.BUZZ_RELEASES_HOOK_SECRET }}
          status: released
          title: night-watchman released ${{ steps.rp.outputs.tag_name }}
          message: ${{ steps.rp.outputs.body }}
          link: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.rp.outputs.tag_name }}
