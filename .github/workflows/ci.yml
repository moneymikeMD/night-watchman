name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftests:
    # macOS, not ubuntu: this repo targets bash 3.2, the /bin/bash macOS ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash version
        run: /bin/bash --version | head -1

      - name: install shellcheck
        run: brew install shellcheck

      - name: install PyYAML
        run: python3 -m pip install --break-system-packages --quiet pyyaml

      - name: work-order dependency
        run: |
          set -euo pipefail
          # The newest tag satisfying plugin.json's ^1 pin, resolved now so no
          # version literal lives here to go stale.
          tag="$(git ls-remote --tags --refs \
                   https://github.com/moneymikeMD/work-order.git 'v1.*' \
                 | awk -F/ '{print $NF}' | sort -V | tail -1)"
          [ -n "$tag" ] || { echo "no v1.* tag on work-order" >&2; exit 1; }
          echo "resolved work-order $tag"
          git clone --depth 1 --branch "$tag" \
            https://github.com/moneymikeMD/work-order.git "$RUNNER_TEMP/work-order"
          test -f "$RUNNER_TEMP/work-order/reference/issues.py"
          echo "WORK_ORDER_ROOT=$RUNNER_TEMP/work-order" >> "$GITHUB_ENV"

      - name: the dependency resolves
        run: scripts/work-order-root.sh --issues-py

      - name: shellcheck
        run: |
          set -euo pipefail
          # SC1091: several scripts source a sibling through a runtime path.
          find hooks providers scripts -name '*.sh' \
            -not -path 'scripts/fixtures/*' -print0 \
          | xargs -0 shellcheck -x -e SC1091 -P SCRIPTDIR

      - name: selftests
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r t; do
            case "$t" in
              # Quarantined: each fails one assertion, filed in docs/known-issues.
              ./providers/config-selftest.sh) continue ;;
              ./providers/tracker/jira/jira-workflow-apply-selftest.sh) continue ;;
            esac
            printf '\n=== %s\n' "${t#./}"
            if "$t"; then :; else
              printf '!!! FAILED: %s\n' "${t#./}"
              failed=1
            fi
          done < <(find . -name '*selftest*.sh' \
                     -not -path './.git/*' \
                     -not -path './scripts/fixtures/*' \
                     -not -path './evals/*' | sort)
          exit "$failed"

      - name: known-failing selftests (informational)
        continue-on-error: true
        run: |
          set -uo pipefail
          providers/config-selftest.sh || true
          providers/tracker/jira/jira-workflow-apply-selftest.sh || true

      - name: known-issues index is not drifted
        run: scripts/known-issue.sh lint

  comment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moneymikeMD/ai-toolkit/actions/comment-lint@v1

  docs-site:
    # Mirrors website-deploy.yml's frozen install: catches a desynced
    # package.json/bun.lock before the deploy does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: frozen install
        working-directory: docs/preview/website
        run: bun install --frozen-lockfile

      - name: build
        working-directory: docs/preview/website
        run: bunx --bun astro build
