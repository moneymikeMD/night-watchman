name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftests:
    # macOS, not ubuntu: this repo targets bash 3.2, the /bin/bash macOS ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash version
        run: /bin/bash --version | head -1

      - name: install shellcheck
        run: brew install shellcheck

      - name: install PyYAML
        run: python3 -m pip install --break-system-packages --quiet pyyaml

      - name: work-order dependency
        run: |
          set -euo pipefail
          # The newest tag satisfying plugin.json's ^1 pin, resolved now so no
          # version literal lives here to go stale.
          tag="$(git ls-remote --tags --refs \
                   https://github.com/moneymikeMD/work-order.git 'v1.*' \
                 | awk -F/ '{print $NF}' | sort -V | tail -1)"
          [ -n "$tag" ] || { echo "no v1.* tag on work-order" >&2; exit 1; }
          echo "resolved work-order $tag"
          git clone --depth 1 --branch "$tag" \
            https://github.com/moneymikeMD/work-order.git "$RUNNER_TEMP/work-order"
          test -f "$RUNNER_TEMP/work-order/reference/issues.py"
          echo "WORK_ORDER_ROOT=$RUNNER_TEMP/work-order" >> "$GITHUB_ENV"

      - name: the dependency resolves
        run: scripts/work-order-root.sh --issues-py

      - name: ai-toolkit dependency
        run: |
          set -euo pipefail
          # ai-toolkit's scripts/ is its UNPINNED surface: consumed by absolute
          # path out of a working checkout, live to every caller on merge. There
          # is no tag to resolve, so this tracks the default branch on purpose.
          git clone --depth 1 \
            https://github.com/moneymikeMD/ai-toolkit.git "$RUNNER_TEMP/ai-toolkit"
          test -f "$RUNNER_TEMP/ai-toolkit/scripts/known-issue.sh"
          echo "AI_TOOLKIT_ROOT=$RUNNER_TEMP/ai-toolkit" >> "$GITHUB_ENV"

      - name: the ai-toolkit dependency resolves
        run: scripts/ai-toolkit-root.sh --known-issue

      - name: shellcheck
        run: |
          set -euo pipefail
          # SC1091: several scripts source a sibling through a runtime path.
          find hooks providers scripts -name '*.sh' \
            -not -path 'scripts/fixtures/*' -print0 \
          | xargs -0 shellcheck -x -e SC1091 -P SCRIPTDIR

      - name: selftests
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r t; do
            case "$t" in
              # Quarantined: each fails one assertion, filed in docs/known-issues.
              ./providers/config-selftest.sh) continue ;;
              ./providers/tracker/jira/jira-workflow-apply-selftest.sh) continue ;;
            esac
            printf '\n=== %s\n' "${t#./}"
            if "$t"; then :; else
              printf '!!! FAILED: %s\n' "${t#./}"
              failed=1
            fi
          done < <(find . -name '*selftest*.sh' \
                     -not -path './.git/*' \
                     -not -path './scripts/fixtures/*' \
                     -not -path './evals/*' | sort)
          exit "$failed"

      - name: known-failing selftests (informational)
        continue-on-error: true
        run: |
          set -uo pipefail
          providers/config-selftest.sh || true
          providers/tracker/jira/jira-workflow-apply-selftest.sh || true

      - name: known-issues index is not drifted
        # NWM-145: known-issue.sh resolves its target repo from cwd, so this
        # runs with cwd in this checkout and never inside ai-toolkit's.
        run: "$(scripts/ai-toolkit-root.sh --known-issue)" lint

      - name: generated reference docs are not drifted
        run: |
          set -uo pipefail
          scripts/gen-reference-docs.sh --check && exit 0
          rc=$?
          echo "::error::Reference pages are stale. Run scripts/gen-reference-docs.sh (no --check) and commit the result." >&2
          exit "$rc"

  comment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moneymikeMD/ai-toolkit/actions/comment-lint@v1

  no-personal-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exceptions are declared in .github/personal-paths-allow.
      - uses: moneymikeMD/ai-toolkit/actions/no-personal-paths@v1

  skill-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # report-only until the two misses in evals/routing/README.md are fixed;
      # a gate that reddens every branch gets disabled rather than obeyed.
      - uses: moneymikeMD/ai-toolkit/actions/skill-routing@v1
        with:
          roots: night-watchman=skills
          fixtures: evals/routing/prompts.json
          allow: evals/routing/allowed-collisions.json
          rank1-floor: "1.0"
          top-k: "1"
          report-only: "true"

  docs-site:
    # Mirrors website-deploy.yml's frozen install: catches a desynced
    # package.json/bun.lock before the deploy does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: frozen install
        working-directory: docs/preview/website
        run: bun install --frozen-lockfile

      - name: build
        working-directory: docs/preview/website
        run: bunx --bun astro build

  no-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No breaking-change marker may reach main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          policy() {
            printf 'no-major: %s carries a breaking-change marker.\n\n' "$1" >&2
            printf '%s\n' \
              'Every repo here is capped below its next major until the owner' \
              'lifts the cap (see WO-060). release-please reads a "!" after the' \
              'type or scope, and a BREAKING-CHANGE footer, as a major bump, so' \
              'neither may reach main. Use a plain feat: or fix: and describe' \
              'the incompatibility in the commit body as prose.' >&2
            exit 1
          }
          has_marker() {
            local msg=$1 subject=${1%%$'\n'*}
            if grep -qE '^[A-Za-z]+(\([^)]*\))?!:' <<<"$subject"; then return 0; fi
            if grep -qE '^BREAKING[ -]CHANGE:' <<<"$msg"; then return 0; fi
            return 1
          }
          if [ -n "${PR_TITLE:-}" ]; then
            if has_marker "$PR_TITLE"; then policy 'the pull request title'; fi
            for sha in $(git log --format=%H "$BASE_SHA..$HEAD_SHA"); do
              if has_marker "$(git log -1 --format=%B "$sha")"; then
                policy "commit $sha"
              fi
            done
          else
            if has_marker "$(git log -1 --format=%B "$PUSH_SHA")"; then
              policy "commit $PUSH_SHA"
            fi
          fi
          echo 'no-major: ok'
